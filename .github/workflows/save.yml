name: Save skin

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Ник игрока (Minecraft)'
        required: true
      skin:
        description: 'Base64 PNG 64x64'
        required: true
      config:
        description: 'JSON-конфиг (опционально)'
        required: false

permissions:
  contents: write

concurrency:
  group: save-${{ inputs.username }}
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate username
        run: |
          USERNAME="${{ inputs.username }}"
          if ! [[ "$USERNAME" =~ ^[A-Za-z0-9_]{3,16}$ ]]; then
            echo "::error::Невалидный ник: $USERNAME (3-16 символов: латиница, цифры, _)"
            exit 1
          fi

          case "$USERNAME" in
            extralist|readme|github|textures|mcskingen|mcskingen-extralist)
              echo "::error::Ник зарезервирован: $USERNAME"
              exit 1 ;;
          esac

      - name: Validate skin size
        env:
          SKIN_B64: ${{ inputs.skin }}
        run: |
          if [ -z "$SKIN_B64" ]; then
            echo "::error::Пустой скин"
            exit 1
          fi
          if [ "${#SKIN_B64}" -gt 65000 ]; then
            echo "::error::Скин слишком большой: ${#SKIN_B64} символов (лимит ~65000)"
            exit 1
          fi

      - name: Write skin files
        env:
          # Конфиг передаём через env, а не через ${{ }} внутри команд:
          # сырая подстановка JSON в bash-строки ломает квотинг/словосплиттинг.
          SKIN_CONFIG: ${{ inputs.config }}
        run: |
          set -e
          mkdir -p textures

          echo "${{ inputs.skin }}" | base64 -d > /tmp/skin.png
          ID=$(sha256sum /tmp/skin.png | awk '{print $1}')
          SHA_PNG="${ID}.png"

          python3 - <<'PY'
          import struct
          with open('/tmp/skin.png', 'rb') as f:
              d = f.read(33)
          assert d[:8] == b'\x89PNG\r\n\x1a\n', 'Not a PNG'
          w, h = struct.unpack('>II', d[16:24])
          assert (w, h) == (64, 64), 'Size is %dx%d, expected 64x64' % (w, h)
          PY

          if [ ! -f "textures/${SHA_PNG}" ]; then
            cp /tmp/skin.png "textures/${SHA_PNG}"
          fi

          USER="${{ inputs.username }}"

          # Модель скина: "default" (Steve, руки 4px) или "slim" (Alex, руки 3px).
          # Ключ в textures профиля CustomSkinAPI — единственный признак модели
          # для MCCustomSkinLoader: "default" -> classic, "slim" -> slim.
          # modelType приходит в inputs.config от клиента ("alex" -> slim).
          MODEL="default"
          if [ -n "$SKIN_CONFIG" ]; then
            MODEL="$(printf '%s' "$SKIN_CONFIG" | python3 -c "import sys,json;print('slim' if json.load(sys.stdin).get('modelType','').lower()=='alex' else 'default')" 2>/dev/null || true)"
            [ -z "$MODEL" ] && MODEL="default"
          fi

          if [ "$MODEL" = "slim" ]; then
            # slim первым — клиенты с поддержкой обеих моделей выберут её;
            # default дублирует тот же файл, чтобы загрузка по textures.default
            # (редактор сайта и клиенты только с classic) продолжала работать.
            printf '{"username":"%s","textures":{"slim":"%s","default":"%s"}}\n' "$USER" "$SHA_PNG" "$SHA_PNG" > "/tmp/${USER}.json"
          else
            printf '{"username":"%s","textures":{"default":"%s"}}\n' "$USER" "$SHA_PNG" > "/tmp/${USER}.json"
          fi
          cp "/tmp/${USER}.json" "${USER}.json"
          cp "/tmp/${USER}.json" "$(printf '%s' "$USER" | tr 'A-Z' 'a-z').json"

      - name: Write config sidecar (optional)
        if: ${{ inputs.config != '' }}
        run: |
          USER="${{ inputs.username }}"

          cat > "${USER}.config.json" <<'JSONEOF'
          ${{ inputs.config }}
          JSONEOF

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — скин уже актуален"
            exit 0
          fi
          git commit -m "Save skin for ${{ inputs.username }}"
          git push origin main

      - name: Purge jsDelivr cache
        if: always()
        run: |
          LOWERCASE_USER="$(printf '%s' '${{ inputs.username }}' | tr 'A-Z' 'a-z')"
          # ВАЖНО: формат {"path": [...]} — устаревший {"urls": [...]} jsDelivr отклоняет
          # (422 "path" is required), поэтому раньше CDN-кэш профилей не очищался вообще.
          # Чистим оба регистра профиля: мод и сайт пробуют точный ник и lowercase-фолбэк.
          # Текстуру чистить не нужно: имя файла = sha256 контента, новый файл — новое имя.
          curl -s -X POST https://purge.jsdelivr.net/ \
            -H "Content-Type: application/json" \
            -d "{\"path\": [\"/gh/${{ github.repository }}@main/${{ inputs.username }}.json\",\"/gh/${{ github.repository }}@main/${LOWERCASE_USER}.json\"]}" \
            || echo "Purge не удался (не критично)"
